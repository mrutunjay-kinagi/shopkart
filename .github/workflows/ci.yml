name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Integration tests start MySQL, Redis and Kafka with Testcontainers (Docker is preinstalled on the runner).
      - name: Build, test and measure coverage
        run: ./mvnw -B verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports
            target/site/jacoco
      - name: Build container image
        run: docker build -t shopkart:${{ github.sha }} .
